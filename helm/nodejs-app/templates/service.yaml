apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-nodejs-app
  namespace: {{ .Release.Namespace }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: nodejs-app

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
