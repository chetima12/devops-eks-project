replicaCount: 3

image:
  repository: 171226592813.dkr.ecr.us-east-1.amazonaws.com/nodejs-eks-app
  tag: "secure2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

containerPort: 3000

environment:
  NODE_ENV: production
  PORT: "3000"

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

  host: ""

  path: /
  pathType: Prefix
