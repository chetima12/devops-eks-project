apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nodejs-app
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/chetima12/devops-eks-project.git

    targetRevision: main

    path: helm/nodejs-app

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc

    namespace: nodejs-app

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:
      - CreateNamespace=true
